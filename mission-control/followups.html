<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow-ups · Mission Control</title>
<style>
  :root{--navy:#0a1628;--navy2:#0d1f3c;--navy3:#112248;--text:#e8edf5;--text2:#8aa0bd;
    --border:#1c3052;--accent:#0080ff;--green:#22c55e;--gold:#e8aa3c;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5}
  header{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--navy2);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:20px;margin:0}.sub{color:var(--text2);font-size:13px;margin-top:3px}
  a{color:var(--accent)} a.home{color:var(--text2);font-size:13px;text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 24px 60px}
  .notice{background:var(--navy2);border:1px dashed var(--border);border-radius:8px;padding:12px 15px;color:#bcd0ee;font-size:12.5px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{border-bottom:1px solid var(--border);padding:9px 10px;text-align:left;vertical-align:top}
  th{color:var(--text2);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  .muted{color:var(--text2)} .age{font-weight:700;color:var(--gold)}
  button{border:none;border-radius:7px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;margin-right:5px}
  .rep{background:var(--green);color:#04210f} .dis{background:transparent;border:1px solid #3a4f73;color:var(--text2)}
  tr.gone{opacity:.3}
</style>
</head>
<body>
<header>
  <div><h1>📮 Follow-ups</h1><div class="sub">Contacts you emailed with no reply detected (7–45 days). Clear the ones already answered.</div></div>
  <a class="home" href="/">← Mission Control</a>
</header>
<div class="wrap">
  <div class="notice" id="note">Loading…</div>
  <table><thead><tr><th>Waiting</th><th>Sent</th><th>Contact</th><th>Subject</th><th>Task</th><th>Action</th></tr></thead>
  <tbody id="rows"></tbody></table>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let ITEMS=[];
fetch('/api/followups',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{
  ITEMS=d.items||[];
  document.getElementById('note').textContent=ITEMS.length+' follow-ups awaiting a reply. Reply detection is send-side only until the M365 metadata connector is live — clear any that were already answered in your work inbox.';
  render();
}).catch(()=>{document.getElementById('note').textContent='Could not load.';});
function render(){
  document.getElementById('rows').innerHTML=ITEMS.map((i,ix)=>{
    const task=i.task_id?`<a href="/index.html?task=${i.task_id}" target="_blank">#${i.task_id}</a>`:'<span class="muted">—</span>';
    return `<tr id="r${ix}">
      <td class="age" style="white-space:nowrap">${i.age}d</td>
      <td class="muted" style="white-space:nowrap">${esc(i.last_sent)}</td>
      <td>${esc(i.name)}<div class="muted" style="font-size:11px">${esc(i.contact)}</div></td>
      <td>${esc(i.subj).slice(0,60)}</td>
      <td>${task}</td>
      <td style="white-space:nowrap"><button class="rep" onclick="clr(${ix},'replied')">✓ Replied</button><button class="dis" onclick="clr(${ix},'dismiss')">Dismiss</button></td></tr>`;
  }).join('')||'<tr><td colspan="6" class="muted">🎉 Nothing awaiting a reply.</td></tr>';
}
function clr(ix,action){
  fetch('/api/followups/clear',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({contact:ITEMS[ix].contact,action})})
    .then(r=>r.json()).then(res=>{if(res.error){alert(res.error);return;}const tr=document.getElementById('r'+ix);if(tr){tr.classList.add('gone');setTimeout(()=>tr.remove(),350);}});
}
</script>
</body>
</html>
