<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSLC — Board Books</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b0b0c;color:#e6e6e6;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:3px solid #F26A21;background:#151516}
header h1{font-size:18px;font-weight:700}
header .who{font-size:13px;color:#9a9a9a}header button{margin-left:12px;background:transparent;border:1px solid #444;color:#ccc;border-radius:6px;padding:5px 10px;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:24px}
section{background:#161617;border:1px solid #2a2a2b;border-radius:10px;padding:20px;margin-bottom:20px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:#F26A21;margin-bottom:12px}
.muted{color:#9a9a9a;font-size:13px}a{color:#F26A21}.doc{margin:8px 0}
.banner{font-size:12px;color:#9a9a9a;margin-top:6px}
</style></head>
<body>
<header><h1 id="title">Scorpius Space Launch Company — Board Books</h1><div><span class="who" id="who"></span><button onclick="location='/set-password.html'">Password</button><button onclick="logout()">Sign out</button></div></header>
<main>
<section><p id="intro" class="muted"></p></section>
<div id="groups"><section class="muted">Loading…</section></div>
<p class="banner">Confidential SSLC records for SSLC directors only. Access is logged.</p>
</main>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function j(u){const r=await fetch(u,{credentials:'same-origin'});if(r.status===401){location='/login?next=/sslc-board.html';throw 0;}return r.json();}
async function logout(){await fetch('/api/logout',{method:'POST',credentials:'same-origin'});location='/login';}
(async()=>{
  try{const me=await j('/api/me');document.getElementById('who').textContent=me.name||me.email||'';}catch(e){}
  try{const s=await j('/api/sslc-board/summary');
    if(s.title)document.getElementById('title').textContent=s.title;
    document.getElementById('intro').textContent=s.intro||'';
    document.getElementById('groups').innerHTML=(s.groups||[]).map(g=>`<section><h2>${esc(g.name)}</h2>${(g.docs||[]).map(d=>`<div class="doc"><a href="/api/sslc-board/doc?id=${encodeURIComponent(d.id)}" target="_blank">${esc(d.title)}</a> <span class="muted">— ${esc(d.desc)}</span></div>`).join('')}</section>`).join('')||'<section class="muted">No records yet.</section>';
  }catch(e){}
})();
</script>
</body></html>
