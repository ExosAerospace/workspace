<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exos — Sales Commissions</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,Segoe UI,sans-serif;background:#0a1628;color:#e8edf2;padding:24px;max-width:1100px;margin:0 auto}
h1{font-size:22px;margin-bottom:2px}h1 span{color:#f5a623}
.sub{color:#8ea3c0;font-size:13px;margin-bottom:18px}
.cards{display:flex;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.card{background:#0f1e38;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px 18px;min-width:180px}
.card .k{color:#8ea3c0;font-size:12px}.card .v{font-size:22px;font-weight:700;margin-top:3px}
.due{color:#f5a623}.paid{color:#3ecf8e}
table{width:100%;border-collapse:collapse;background:#0f1e38;border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.06)}
th{color:#8ea3c0;font-weight:600;background:#12233f}
tr:last-child td{border-bottom:none}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.b-due{background:rgba(245,166,35,.15);color:#f5a623}.b-paid{background:rgba(62,207,142,.15);color:#3ecf8e}
.notice{background:#0f1e38;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:30px;text-align:center;color:#8ea3c0}
.muted{color:#6b7f9e;font-size:12px;margin-top:14px}
a{color:#f5a623;text-decoration:none}
</style></head>
<body>
<h1>Exos <span>Sales Commissions</span></h1>
<div class="sub" id="sub">Loading…</div>
<div id="content"></div>
<div class="muted">Restricted view · commissions live in the audited ERP ledger · QuickBooks remains the book of record. <a href="/">← Mission Control</a></div>
<script>
const fmt = n => '$' + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
async function load(){
  let me={}; try{ me = await (await fetch('/api/me',{credentials:'same-origin'})).json(); }catch(e){}
  const r = await fetch('/api/commissions',{credentials:'same-origin'});
  if(r.status===401){ location.href='/login?next=/commissions.html'; return; }
  const d = await r.json();
  const sub = document.getElementById('sub'), content = document.getElementById('content');
  if(d.scope==='none'){
    sub.textContent = 'Signed in as ' + (d.viewer||'');
    content.innerHTML = '<div class="notice">You don’t have access to commissions.<br><span class="muted">Visible to Jon, the CTO, and each sales agent (their own only).</span></div>';
    return;
  }
  sub.textContent = (d.scope==='full' ? 'Full view (all agents)' : 'Your commissions') + ' · ' + (d.viewer||'');
  const rows = d.rows||[];
  let html = '<div class="cards">'
    + '<div class="card"><div class="k">Due (unpaid)</div><div class="v due">'+fmt(d.totals.due)+'</div></div>'
    + '<div class="card"><div class="k">Paid to date</div><div class="v paid">'+fmt(d.totals.paid)+'</div></div>'
    + '<div class="card"><div class="k">Records</div><div class="v">'+rows.length+'</div></div></div>';
  if(!rows.length){
    html += '<div class="notice">No commissions recorded yet.<br><span class="muted">A commission is created when Exos is paid on a contract you’re attributed to.</span></div>';
  } else {
    html += '<table><thead><tr>'
      + (d.scope==='full'?'<th>Agent</th>':'')
      + '<th>Contract</th><th>Customer</th><th>Exos paid</th><th>Rate</th><th>Commission</th><th>Status</th><th>Due</th></tr></thead><tbody>';
    for(const c of rows){
      const rate = ((c.rate||0)*100).toFixed(0) + '%'
        + (c.bonus_applies ? ' +'+((c.bonus_rate||0)*100).toFixed(0)+'% on last-25% ('+(c.bonus_mass||0)+'kg / '+fmt(c.bonus_base_amount)+')' : '');
      const badge = c.status==='paid' ? '<span class="badge b-paid">paid</span>' : '<span class="badge b-due">due</span>';
      html += '<tr>'
        + (d.scope==='full'?'<td>'+(c.agent_name||'')+'</td>':'')
        + '<td>'+(c.contract_id||'')+'</td><td>'+(c.customer||'')+'</td><td>'+fmt(c.payment_amount)+'</td>'
        + '<td>'+rate+'</td><td><b>'+fmt(c.commission_amount)+'</b></td><td>'+badge+'</td>'
        + '<td>'+(c.status==='paid'?(c.paid_date||''):(c.due_date||''))+'</td></tr>';
    }
    html += '</tbody></table>';
  }
  content.innerHTML = html;
}
load();
</script></body></html>
