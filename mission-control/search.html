<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Mission Control</title>
<style>
  :root{--navy:#0a1628;--card:#0f1e38;--text:#e8edf5;--muted:#8aa0bd;
    --accent:#0080ff;--green:#22c55e;--red:#ff4444;--yellow:#eab308;--line:#1c3052;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:18px 24px 60px}
  a.back{color:var(--accent);text-decoration:none;font-size:13px}
  h1{font-size:22px;margin:6px 0 2px}
  .searchwrap{position:relative;margin:14px 0 6px;max-width:720px}
  #q{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);
    font-size:17px;padding:14px 16px 14px 44px;outline:none}
  #q:focus{border-color:var(--accent)}
  .searchwrap .mag{position:absolute;left:15px;top:13px;font-size:18px;opacity:.7}
  .hint{color:var(--muted);font-size:12px;margin:6px 2px}
  .kbd{background:#16294a;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--muted)}
  .group{margin:18px 0 6px;max-width:820px}
  .ghead{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px;display:flex;gap:8px;align-items:center}
  .ghead .cnt{background:#16294a;border-radius:10px;padding:0 7px;font-size:11px}
  .res{display:block;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:9px 12px;margin-bottom:6px;max-width:820px}
  .res:hover,.res.sel{border-color:var(--accent);background:#12244300}
  .res.sel{outline:2px solid var(--accent)}
  .res .t{font-weight:600;font-size:14px}
  .res .s{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res .b{float:right;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin-left:8px}
  mark{background:rgba(0,128,255,.35);color:#fff;border-radius:2px;padding:0 1px}
  .status{color:var(--muted);font-size:13px;margin:16px 2px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<a class="back" href="/index.html">← Mission Control</a>
<h1>🔎 Global Search</h1>
<div class="searchwrap">
  <span class="mag">🔎</span>
  <input id="q" type="text" autocomplete="off" spellcheck="false"
    placeholder="Search tasks, contacts, companies, deals, opportunities, decisions, dossiers…">
</div>
<div class="hint">Searches across Mission Control. <span class="kbd">↑</span> <span class="kbd">↓</span> to navigate · <span class="kbd">Enter</span> to open · <span class="kbd">Esc</span> to clear</div>
<div id="out"></div>

<script>
const out=document.getElementById('out'), qi=document.getElementById('q');
let flat=[], sel=-1, timer=null, lastQ='', seq=0;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hl(s,q){ s=esc(s); if(!q)return s; try{return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')}catch(e){return s} }
function run(q){
  q=q.trim();
  if(q.length<2){out.innerHTML='<div class="status">Type at least 2 characters…</div>';flat=[];sel=-1;return;}
  const my=++seq;
  out.innerHTML='<div class="status"><span class="spin"></span>Searching “'+esc(q)+'”…</div>';
  fetch('/api/search?q='+encodeURIComponent(q),{credentials:'same-origin'})
    .then(r=>r.ok?r.json():Promise.reject(r.status)).then(d=>{
      if(my!==seq)return; // stale response
      render(d,q);
    }).catch(e=>{ if(my===seq) out.innerHTML='<div class="status">Search error ('+e+'). Try again.</div>'; });
}
function render(d,q){
  flat=[]; sel=-1;
  if(!d.groups||!d.groups.length){ out.innerHTML='<div class="status">No matches for “'+esc(q)+'”.</div>'; return; }
  let html='<div class="status">'+d.total+' result'+(d.total===1?'':'s')+' for “'+esc(q)+'”</div>';
  for(const g of d.groups){
    html+='<div class="group"><div class="ghead">'+g.icon+' '+esc(g.label)+' <span class="cnt">'+g.results.length+'</span></div>';
    for(const r of g.results){
      const i=flat.length; flat.push(r);
      html+='<a class="res" data-i="'+i+'" href="'+esc(r.url)+'">'+
        (r.badge?'<span class="b">'+esc(r.badge)+'</span>':'')+
        '<div class="t">'+hl(r.title,q)+'</div>'+
        (r.subtitle?'<div class="s">'+hl(r.subtitle,q)+'</div>':'')+'</a>';
    }
    html+='</div>';
  }
  out.innerHTML=html;
}
function move(d){ if(!flat.length)return; sel=(sel+d+flat.length)%flat.length;
  document.querySelectorAll('.res').forEach(e=>e.classList.remove('sel'));
  const el=document.querySelector('.res[data-i="'+sel+'"]'); if(el){el.classList.add('sel'); el.scrollIntoView({block:'nearest'});} }
qi.addEventListener('input',()=>{ const v=qi.value; if(v===lastQ)return; lastQ=v;
  history.replaceState({},'', '/search.html'+(v?'?q='+encodeURIComponent(v):'')); clearTimeout(timer); timer=setTimeout(()=>run(v),180); });
qi.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();move(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();move(-1);}
  else if(e.key==='Enter'){ const el=document.querySelector('.res[data-i="'+sel+'"]')||document.querySelector('.res'); if(el){location.href=el.getAttribute('href');} }
  else if(e.key==='Escape'){ qi.value=''; lastQ=''; run(''); history.replaceState({},'','/search.html'); }
});
// seed from ?q=
const q0=new URLSearchParams(location.search).get('q')||'';
qi.value=q0; lastQ=q0; qi.focus();
if(q0) run(q0); else out.innerHTML='<div class="status">Start typing to search across the whole board.</div>';
</script>
</body>
</html>
