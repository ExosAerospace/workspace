<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operational Finance — Exos Mission Control</title>
<style>
  :root{--navy:#0a1628;--navy2:#0d1f3c;--navy3:#112248;--border:#1e3a5f;--text:#e8eef7;--text2:#8fa6c4;
        --cyan:#009ed9;--green:#33c27f;--amber:#ffb800;--red:#ff5a5a;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding:0}
  header{background:var(--navy2);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
  header a{color:var(--text2);text-decoration:none;font-size:13px}
  h1{font-size:19px;font-weight:700}
  .lock{font-size:11px;color:var(--amber);border:1px solid var(--amber);border-radius:6px;padding:2px 8px;margin-left:auto}
  .wrap{max-width:1000px;margin:0 auto;padding:24px}
  .asof{color:var(--text2);font-size:12px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .card{background:var(--navy3);border:1px solid var(--border);border-radius:12px;padding:20px}
  .card .label{color:var(--text2);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .card .val{font-size:30px;font-weight:700;margin-top:8px}
  .card .sub{color:var(--text2);font-size:12px;margin-top:6px}
  .good{color:var(--green)} .warn{color:var(--amber)} .bad{color:var(--red)} .cy{color:var(--cyan)}
  .row{margin-top:22px;background:var(--navy3);border:1px solid var(--border);border-radius:12px;padding:18px}
  .row h3{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:7px 4px;border-bottom:1px solid var(--border)} td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .alert{background:rgba(255,90,90,.12);border:1px solid var(--red);border-radius:10px;padding:14px;margin-top:18px;color:#ffd7d7;font-size:14px}
  .foot{color:var(--text2);font-size:11px;margin-top:22px;line-height:1.5}
  .err{color:var(--red);padding:24px}
</style></head>
<body>
<header>
  <h1>💵 Operational Finance</h1>
  <span class="lock">🔒 RESTRICTED</span>
</header>
<div class="wrap">
  <div style="margin-bottom:16px"><a href="/">← Mission Control</a></div>
  <div id="content"><div class="asof">Loading live from QuickBooks…</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
async function load(){
  let r;
  try{ r=await fetch('/api/operational-finance',{credentials:'same-origin'}); }
  catch(e){ document.getElementById('content').innerHTML='<div class="err">Unable to reach the finance service.</div>'; return; }
  if(r.status===403){ document.getElementById('content').innerHTML='<div class="err">You do not have access to this view.</div>'; return; }
  if(!r.ok){ document.getElementById('content').innerHTML='<div class="err">Finance data unavailable.</div>'; return; }
  const d=await r.json(); const m=d.metrics||{}; const al=d.alerts||[];
  const burning=m.burning;
  const runway = m.runway_months==null ? 'Profitable — building cash' : (m.runway_months+' months');
  const runwayCls = m.runway_months==null ? 'good' : (m.runway_months<6?'bad':(m.runway_months<12?'warn':'good'));
  const netCls = (m.monthly_net||0)>=0?'good':'bad';
  const rrCls = m.vs_plan_profitable?'good':'bad';
  let html='';
  html+='<div class="asof">as of '+(m.asof||'')+' · source: QuickBooks (live) · Exos realm</div>';
  html+='<div class="grid">';
  html+='<div class="card"><div class="label">Cash on hand</div><div class="val cy">'+money(m.cash||0)+'</div><div class="sub">general checking + bank</div></div>';
  html+='<div class="card"><div class="label">'+(burning?'Monthly burn':'Monthly surplus')+'</div><div class="val '+netCls+'">'+(m.monthly_net>=0?'+':'')+money(m.monthly_net||0)+'</div><div class="sub">trailing '+(m.trailing_days||90)+' days</div></div>';
  html+='<div class="card"><div class="label">Runway</div><div class="val '+runwayCls+'">'+runway+'</div><div class="sub">cash ÷ monthly burn</div></div>';
  html+='<div class="card"><div class="label">Annualized net run-rate</div><div class="val '+rrCls+'">'+money(m.annualized_net_runrate||0)+'</div><div class="sub">FY2025 baseline net +'+money(m.plan_baseline_net||0)+'</div></div>';
  html+='</div>';
  html+='<div class="row"><h3>Trailing '+(m.trailing_days||90)+' days</h3><table>'+
        '<tr><td>Revenue</td><td class="cy">'+money(m.trailing_income||0)+'</td></tr>'+
        '<tr><td>Expenses</td><td>'+money(m.trailing_expenses||0)+'</td></tr>'+
        '<tr><td>Net</td><td class="'+((m.trailing_net||0)>=0?'good':'bad')+'">'+((m.trailing_net||0)>=0?'+':'')+money(m.trailing_net||0)+'</td></tr>'+
        '</table></div>';
  if(al.length){ html+='<div class="alert">⚠️ '+al.join('<br>⚠️ ')+'</div>'; }
  document.getElementById('content').innerHTML=html;
  document.getElementById('foot').innerHTML='Operational-Finance-exo3 · read-only from QuickBooks · thresholds: cash $'+
    (d.thresholds&&d.thresholds.cash||0).toLocaleString()+' / runway '+(d.thresholds&&d.thresholds.runway_months||0)+' mo · '+
    'Scope: Exos only (Scorpius on separate books). Generated '+(d.generated||'').replace('T',' ');
}
load();
</script>
</body></html>
