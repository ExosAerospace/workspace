<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operational Finance — Exos Mission Control</title>
<style>
  :root{--navy:#0a1628;--navy2:#0d1f3c;--navy3:#112248;--border:#1e3a5f;--text:#e8eef7;--text2:#8fa6c4;
        --cyan:#009ed9;--green:#33c27f;--amber:#ffb800;--red:#ff5a5a;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding:0}
  header{background:var(--navy2);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;gap:12px}
  header a{color:var(--text2);text-decoration:none;font-size:13px}
  h1{font-size:19px;font-weight:700}
  .lock{font-size:11px;color:var(--amber);border:1px solid var(--amber);border-radius:6px;padding:2px 8px;margin-left:auto}
  .wrap{max-width:1000px;margin:0 auto;padding:24px}
  .asof{color:var(--text2);font-size:12px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .card{background:var(--navy3);border:1px solid var(--border);border-radius:12px;padding:20px}
  .card .label{color:var(--text2);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .card .val{font-size:30px;font-weight:700;margin-top:8px}
  .card .sub{color:var(--text2);font-size:12px;margin-top:6px}
  .good{color:var(--green)} .warn{color:var(--amber)} .bad{color:var(--red)} .cy{color:var(--cyan)}
  .row{margin-top:22px;background:var(--navy3);border:1px solid var(--border);border-radius:12px;padding:18px}
  .row h3{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:7px 4px;border-bottom:1px solid var(--border)} td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .alert{background:rgba(255,90,90,.12);border:1px solid var(--red);border-radius:10px;padding:14px;margin-top:18px;color:#ffd7d7;font-size:14px}
  .foot{color:var(--text2);font-size:11px;margin-top:22px;line-height:1.5}
  .err{color:var(--red);padding:24px}
</style></head>
<body>
<header>
  <h1>💵 Operational Finance</h1>
  <span class="lock">🔒 RESTRICTED</span>
</header>
<div class="wrap">
  <div style="margin-bottom:16px"><a href="/">← Mission Control</a></div>
  <div id="content"><div class="asof">Loading live from QuickBooks…</div></div>
  <div id="capital" style="margin-top:28px"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
async function load(){
  let r;
  try{ r=await fetch('/api/operational-finance',{credentials:'same-origin'}); }
  catch(e){ document.getElementById('content').innerHTML='<div class="err">Unable to reach the finance service.</div>'; return; }
  if(r.status===403){ document.getElementById('content').innerHTML='<div class="err">You do not have access to this view.</div>'; return; }
  if(!r.ok){ document.getElementById('content').innerHTML='<div class="err">Finance data unavailable.</div>'; return; }
  const d=await r.json(); const m=d.metrics||{}; const al=d.alerts||[];
  const burning=m.burning;
  const runway = m.runway_months==null ? 'Profitable — building cash' : (m.runway_months+' months');
  const runwayCls = m.runway_months==null ? 'good' : (m.runway_months<6?'bad':(m.runway_months<12?'warn':'good'));
  const netCls = (m.monthly_net||0)>=0?'good':'bad';
  const rrCls = m.vs_plan_profitable?'good':'bad';
  let html='';
  html+='<div class="asof">as of '+(m.asof||'')+' · source: QuickBooks (live) · Exos realm</div>';
  html+='<div class="grid">';
  html+='<div class="card"><div class="label">Cash on hand</div><div class="val cy">'+money(m.cash||0)+'</div><div class="sub">general checking + bank</div></div>';
  if(m.ytd_net!=null){
    var ytdCls=(m.ytd_profitable?'good':'bad');
    html+='<div class="card"><div class="label">FY2026 YTD net income</div><div class="val '+ytdCls+'">'+(m.ytd_net>=0?'+':'')+money(m.ytd_net||0)+'</div><div class="sub">'+(m.ytd_margin_pct!=null?m.ytd_margin_pct+'% margin · ':'')+'Jan 1–'+(m.asof||'')+' · actuals</div></div>';
  }
  html+='<div class="card"><div class="label">'+(burning?'Trailing burn (90d trough)':'Monthly surplus')+'</div><div class="val '+netCls+'">'+(m.monthly_net>=0?'+':'')+money(m.monthly_net||0)+'</div><div class="sub">trailing '+(m.trailing_days||90)+'d — billing-trough artifact</div></div>';
  html+='<div class="card"><div class="label">Runway</div><div class="val '+runwayCls+'">'+runway+'</div><div class="sub">cash ÷ monthly burn</div></div>';
  html+='<div class="card"><div class="label">Annualized net run-rate</div><div class="val '+rrCls+'">'+money(m.annualized_net_runrate||0)+'</div><div class="sub">FY2025 baseline net +'+money(m.plan_baseline_net||0)+'</div></div>';
  html+='</div>';
  if(m.ytd_net!=null){
    html+='<div class="row"><h3>FY2026 YTD actuals (Jan 1–'+(m.asof||'')+') · LIVE-QB</h3><table>'+
        '<tr><td>Revenue</td><td class="cy">'+money(m.ytd_income||0)+'</td></tr>'+
        '<tr><td>Expenses</td><td>'+money(m.ytd_expenses||0)+'</td></tr>'+
        '<tr><td>Net income'+(m.ytd_margin_pct!=null?' ('+m.ytd_margin_pct+'% margin)':'')+'</td><td class="'+(m.ytd_profitable?'good':'bad')+'">'+((m.ytd_net||0)>=0?'+':'')+money(m.ytd_net||0)+'</td></tr>'+
        '</table></div>';
  }
  html+='<div class="row"><h3>Trailing '+(m.trailing_days||90)+' days <span style="font-weight:400;opacity:.7">(billing-trough artifact — not the headline)</span></h3><table>'+
        '<tr><td>Revenue</td><td class="cy">'+money(m.trailing_income||0)+'</td></tr>'+
        '<tr><td>Expenses</td><td>'+money(m.trailing_expenses||0)+'</td></tr>'+
        '<tr><td>Net</td><td class="'+((m.trailing_net||0)>=0?'good':'bad')+'">'+((m.trailing_net||0)>=0?'+':'')+money(m.trailing_net||0)+'</td></tr>'+
        '</table></div>';
  if(al.length){ html+='<div class="alert">⚠️ '+al.join('<br>⚠️ ')+'</div>'; }
  document.getElementById('content').innerHTML=html;
  document.getElementById('foot').innerHTML='Operational-Finance-exo3 · read-only from QuickBooks · thresholds: cash $'+
    (d.thresholds&&d.thresholds.cash||0).toLocaleString()+' / runway '+(d.thresholds&&d.thresholds.runway_months||0)+' mo · '+
    'Scope: Exos only (Scorpius on separate books). Generated '+(d.generated||'').replace('T',' ');
}
async function loadCapital(){
  let r; try{ r=await fetch('/api/capital-bridge',{credentials:'same-origin'}); }catch(e){ return; }
  if(!r.ok) return;
  const c=await r.json(); if(!c.target) return;
  const dsc=c.days_since_commitment, th=c.threshold_days;
  const cls = dsc==null?'good':(dsc>=th*2?'bad':(dsc>=th?'warn':'good'));
  let h='';
  h+='<div class="row"><h3>💰 504 Capital Bridge — '+(c.program||'PO10 raise')+'</h3>';
  // progress
  h+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">'+
     '<div style="font-size:26px;font-weight:700" class="cy">'+money(c.received)+'</div>'+
     '<div class="sub" style="color:var(--text2)">of '+money(c.target)+' target · '+c.pct+'%</div></div>';
  h+='<div style="height:10px;background:#0a1628;border-radius:6px;overflow:hidden;border:1px solid var(--border)">'+
     '<div style="height:100%;width:'+Math.min(100,c.pct)+'%;background:var(--cyan)"></div></div>';
  // trigger tiles
  h+='<div class="grid" style="margin-top:16px">';
  h+='<div class="card" style="border-color:'+(dsc>=th?'var(--amber)':'var(--border)')+'"><div class="label">Days since last commitment</div>'+
     '<div class="val '+cls+'">'+(dsc==null?'—':dsc)+'</div><div class="sub">last: '+(c.last_commitment||'—')+(c.last_commitment_who?' · '+c.last_commitment_who:'')+'</div></div>';
  h+='<div class="card"><div class="label">Days since cash received</div><div class="val">'+(c.days_since_received==null?'—':c.days_since_received)+'</div><div class="sub">last funds: '+(c.last_received||'—')+'</div></div>';
  h+='<div class="card"><div class="label">Signed packets pending</div><div class="val">'+(c.pending_count||0)+'</div><div class="sub">executed · funds not yet received</div></div>';
  h+='</div>';
  // David outreach trigger banner
  if(c.trigger){
    h+='<div class="alert" style="background:rgba(255,184,0,.12);border-color:var(--amber);color:#ffe9b0;margin-top:16px">'+
       '🔔 <b>'+dsc+' days</b> since our last commitment (threshold '+th+'). <b>Action — David:</b> send the next round of investor follow-ups & outreach to move PO10 toward the $1M target.</div>';
  }
  // recent commitments
  if(c.recent&&c.recent.length){
    h+='<div style="margin-top:14px"><h3 style="font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Recent commitments</h3><table>';
    c.recent.forEach(function(e){ h+='<tr><td>'+(e.date||'')+' · '+(e.investor||'?')+'</td><td>'+(typeof e.amount==='number'?money(e.amount):'—')+'</td></tr>'; });
    h+='</table></div>';
  }
  // exo3 sign-off gate: email-parsed receipts are NOT in the total until a human confirms them.
  if(c.awaiting_confirmation&&c.awaiting_confirmation.length){
    h+='<div style="margin-top:14px;border:1px solid var(--amber);border-radius:8px;padding:10px"><h3 style="font-size:12px;color:var(--amber);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Awaiting confirmation — parsed from email, NOT in the total</h3><table>';
    c.awaiting_confirmation.forEach(function(e,i){ h+='<tr><td>'+esc(e.date||'')+' · '+esc(e.investor||'?')+'<div class="sub" style="color:var(--text2)">'+esc(e.source||'')+'</div></td><td>'+(typeof e.amount==='number'?money(e.amount):'—')+'</td>'+
      '<td style="white-space:nowrap"><button onclick="cbReview('+i+',\'confirm\')">✓ Confirm</button> <button onclick="cbReview('+i+',\'reject\')">✕ Reject</button></td></tr>'; });
    h+='</table></div>';
  }
  window.__cbAwaiting=c.awaiting_confirmation||[];
  h+='</div>';
  document.getElementById('capital').innerHTML=h;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
async function cbReview(i,action){
  const e=(window.__cbAwaiting||[])[i]; if(!e) return;
  let amount=e.amount;
  if(action==='confirm'){
    const v=prompt('Confirm funds received from '+(e.investor||'?')+'. Verify the amount (USD) against the bank/deposit record:', e.amount==null?'':e.amount);
    if(v===null) return; amount=Number(String(v).replace(/[$,]/g,''));
  } else if(!confirm('Reject this entry? It stays in the ledger as rejected and never counts.')) return;
  const r=await fetch('/api/capital-bridge/confirm',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({message_id:e.message_id,action:action,amount:amount})});
  const j=await r.json().catch(function(){return {};});
  if(!j.ok) alert('Could not save: '+(j.error||('HTTP '+r.status)));
  loadCapital();
}
load();
loadCapital();
</script>
</body></html>
