<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Your Password — Mission Control</title>
<style>
  :root{--navy:#0a1628;--card:#0f1e38;--text:#e8edf5;--muted:#8aa0bd;--accent:#0080ff;
    --green:#22c55e;--red:#ff4444;--line:#1c3052;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:420px;width:100%;border-top:4px solid var(--accent)}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  input{width:100%;background:#0a1830;border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:11px 12px;font-size:14px}
  button{width:100%;margin-top:18px;background:var(--accent);color:#fff;border:none;
    border-radius:9px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{margin-top:14px;font-size:13px;min-height:18px}
  .ok{color:var(--green)} .err{color:var(--red)}
  a{color:var(--muted);font-size:13px;text-decoration:none;display:inline-block;margin-top:16px}
</style>
</head>
<body>
<div class="box">
  <h1>🔑 Set Your Password</h1>
  <div class="sub">Choose your own Mission Control password. This stays private to you — no one else sets or sees it.</div>
  <label>New password (at least 8 characters)</label>
  <input type="password" id="p1" autocomplete="new-password">
  <label>Confirm new password</label>
  <input type="password" id="p2" autocomplete="new-password">
  <button id="go" onclick="save()">Set password</button>
  <div class="msg" id="msg"></div>
  <a href="/">← Back to Mission Control</a>
</div>
<script>
// Force a valid session before the user can even fill the form, so a change
// can never appear to succeed while the server would reject it (401).
(async function(){
  try{
    const m=await fetch('/api/me',{credentials:'same-origin'});
    if(m.status===401){window.location='/login?next=/set-password.html';return;}
  }catch(e){/* offline: let the save() path handle it */}
})();
async function save(){
  const p1=document.getElementById('p1').value, p2=document.getElementById('p2').value;
  const msg=document.getElementById('msg'), go=document.getElementById('go');
  msg.className='msg'; msg.textContent='';
  if(p1.length<8){msg.className='msg err';msg.textContent='Password must be at least 8 characters.';return;}
  if(p1!==p2){msg.className='msg err';msg.textContent='Passwords do not match.';return;}
  go.disabled=true;
  try{
    const r=await fetch('/api/change-password',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({newPassword:p1})});
    if(r.status===401){msg.className='msg err';msg.textContent='Your session expired. Redirecting you to log in…';setTimeout(function(){window.location='/login?next=/set-password.html';},900);return;}
    const d=await r.json();
    if(r.ok&&d.success){msg.className='msg ok';msg.textContent='✓ Password set. You can use it next time you log in.';document.getElementById('p1').value='';document.getElementById('p2').value='';}
    else{msg.className='msg err';msg.textContent=d.error||'Could not set password.';go.disabled=false;}
  }catch(e){msg.className='msg err';msg.textContent='Network error, try again.';go.disabled=false;}
}
</script>
</body>
</html>
