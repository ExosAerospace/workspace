<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Inventory — Exos Mission Control</title>
<style>
:root{--bg:#0e0f11;--panel:#17191c;--border:#2a2d31;--text:#e8e8e8;--text2:#a6adb5;--orange:#F26A21}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap}
h1{font-size:1.1rem;margin:0}
.sub{color:var(--text2);font-size:.8rem}
.btn{background:var(--orange);color:#111;border:none;border-radius:6px;padding:6px 12px;font-weight:600;text-decoration:none;font-size:.8rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--orange);border:1px solid var(--orange)}
.back{color:var(--text2);text-decoration:none;font-size:.8rem}
.kpis{display:flex;gap:10px;padding:12px 20px;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--orange);border-radius:6px;padding:8px 14px;min-width:110px}
.kpi .n{font-size:1.3rem;font-weight:800}.kpi .l{color:var(--text2);font-size:.7rem;text-transform:uppercase;letter-spacing:.4px}
.controls{display:flex;gap:8px;padding:0 20px 12px;flex-wrap:wrap;align-items:center}
input,select{background:#0b0c0e;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:.85rem}
input#q{min-width:240px}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{position:sticky;top:0;background:#111;color:var(--text2);text-transform:uppercase;font-size:.68rem;letter-spacing:.4px;cursor:pointer}
tr:hover td{background:#191b1e}
.rocket{color:var(--orange);font-weight:700}
.tag{display:inline-block;background:#222;border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:.68rem;color:var(--text2)}
.wrap{padding:0 20px 40px}
.muted{color:var(--text2)}
.ebtn{background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:.85rem}
.ebtn:hover{border-color:var(--orange);color:var(--orange)}
.etag{color:var(--orange);cursor:help}
.ovl{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}
.ovl.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;width:92%;max-width:520px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:1rem}
.modal .k{color:var(--text2);font-size:.75rem;margin-bottom:10px;font-family:ui-monospace,Menlo,monospace}
.modal label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin:10px 0 4px}
.modal input,.modal textarea{width:100%;background:#0b0c0e;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font:inherit}
.modal textarea{min-height:52px;resize:vertical}
.modal .row2{display:flex;gap:10px}.modal .row2>div{flex:1}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.diffbox{background:#0b0c0e;border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:12px;font-size:.82rem}
.diffbox .d{margin:4px 0}.diffbox .o{color:#e0524d;text-decoration:line-through}.diffbox .n2{color:#4caf50;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#12331a;border:1px solid #4caf50;color:#d7ffd7;padding:10px 16px;border-radius:8px;z-index:60;display:none}
.toast.on{display:block}
.thumb{width:34px;height:34px;object-fit:cover;border-radius:4px;border:1px solid var(--border);margin-right:3px;vertical-align:middle;cursor:pointer}
.phbtn{background:transparent;border:1px dashed var(--border);color:var(--text2);border-radius:6px;padding:2px 7px;cursor:pointer;font-size:.78rem;vertical-align:middle;white-space:nowrap}
.phbtn:hover{border-color:var(--orange);color:var(--orange)}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.phcard{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#111316}
.phcard img{width:100%;height:120px;object-fit:cover;display:block;background:#000}
.phcard .meta{font-size:.68rem;color:var(--text2);padding:5px 7px;line-height:1.3}
.phcard .pacts{display:flex;justify-content:flex-end;padding:0 6px 6px}
.phdel{background:transparent;border:1px solid var(--border);color:#e0524d;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:.75rem}
.phconfirm{padding:6px 7px 8px;font-size:.72rem;border-top:1px solid #e0524d55;background:#e0524d14}
.phconfirm button{margin-top:5px;margin-right:4px;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:.72rem;border:1px solid var(--border);background:transparent;color:var(--text)}
.phconfirm .yes{background:#c62828;border-color:#c62828;color:#fff}
.sid{display:block;color:var(--text2);font-size:.66rem;font-family:ui-monospace,Menlo,monospace}
</style></head><body>
<header>
  <h1>📦 Shop Inventory <span class="muted" style="font-weight:400;font-size:.8rem">— inventory of record</span></h1>
  <span class="sub" id="sub">loading…</span>
  <span style="flex:1"></span>
  <button class="btn" onclick="exportCSV()">⬇ Export CSV</button>
  <a class="btn ghost" href="/inventory.html">📋 BLK3 Build Shortfall</a>
  <a class="back" href="/index.html">← Mission Control</a>
</header>
<div class="kpis" id="kpis"></div>
<div class="controls">
  <select id="cat"><option value="">All categories</option></select>
  <select id="rocket"><option value="">Rocket + non-rocket</option><option value="1">Rocket only</option><option value="0">Non-rocket only</option></select>
  <input id="loc" placeholder="location…" size="12">
  <input id="q" placeholder="search contents / SKU / description…">
  <span class="muted" id="count"></span>
</div>
<div class="wrap"><table id="tbl"><thead><tr>
  <th data-k="category">Category</th><th data-k="location">Location</th><th data-k="contents">Contents</th>
  <th data-k="description">Description</th><th data-k="exos_sku">Exos SKU</th><th data-k="source_sku">Source/SKU</th>
  <th data-k="qty">Qty</th><th data-k="unit">Unit</th><th data-k="value">Value</th><th data-k="jurisdiction">Juris.</th><th>Photos</th><th>Edit</th>
</tr></thead><tbody id="body"><tr><td colspan="12" class="muted" style="padding:30px;text-align:center">loading…</td></tr></tbody></table></div>
<script>
let ALL=[], VIEW=[], sortK='category', sortDir=1;
const $=id=>document.getElementById(id);
function fmt(n){n=parseFloat(n)||0;return n?('$'+n.toLocaleString(undefined,{maximumFractionDigits:0})):''}
async function load(){
  const p=new URLSearchParams();
  if($('cat').value)p.set('category',$('cat').value);
  if($('rocket').value)p.set('rocket',$('rocket').value);
  if($('loc').value)p.set('location',$('loc').value);
  if($('q').value)p.set('search',$('q').value);
  const r=await fetch('/api/shop-inventory?'+p.toString()); const d=await r.json();
  ALL=d.items||[]; VIEW=ALL.slice();
  $('sub').textContent=(d.source_file||'')+' · '+(d.total_all||0)+' lines of record';
  // KPIs
  const cats=d.counts||{};
  $('kpis').innerHTML=
    kpi(d.total_all||0,'Total lines')+
    kpi(d.filtered||0,'Filtered')+
    kpi(fmt(d.total_value)||'$0','Filtered value')+
    Object.entries(cats).map(([k,v])=>kpi(v,k)).join('');
  // populate category dropdown once
  if($('cat').options.length<=1) (d.categories||[]).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;$('cat').appendChild(o)});
  sortAndRender();
}
function kpi(n,l){return `<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`}
function sortAndRender(){
  VIEW.sort((a,b)=>{let x=a[sortK],y=b[sortK];if(sortK==='qty'||sortK==='value'){x=parseFloat(x)||0;y=parseFloat(y)||0;return (x-y)*sortDir}return String(x||'').localeCompare(String(y||''))*sortDir});
  $('body').innerHTML=VIEW.map(i=>`<tr>
    <td>${i.category||''}${i.sale_or_trash?' <span class="tag">S/T</span>':''}<span class="sid" title="Permanent Exos ID (last column of Steve's sheet)">${esc(i.id)}</span></td>
    <td>${esc(i.location)}</td>
    <td class="${i.is_rocket?'rocket':''}">${esc(i.contents)}${i.serial?`<div class="muted" style="font-size:11px">S/N: ${esc(i.serial)}</div>`:''}</td>
    <td class="muted">${esc(i.description)}${i.edited_by?` <span class="etag" title="edited by ${esc(i.edited_by)} on ${esc((i.edited_at||'').slice(0,10))}${i.edit_note?' · '+esc(i.edit_note):''}">✎</span>`:''}</td>
    <td>${esc(i.exos_sku)}</td><td>${esc(i.source_sku)}</td>
    <td>${i.qty||0}</td><td>${i.unit||''}</td><td>${fmt(i.value)}</td><td>${i.jurisdiction||''}</td>
    <td>${photoCell(i)}</td>
    <td><button class="ebtn" title="Edit item" onclick="shopEdit('${i.id}')">✎</button></td>
  </tr>`).join('')||'<tr><td colspan="12" class="muted" style="padding:30px;text-align:center">no matches</td></tr>';
  $('count').textContent=VIEW.length+' shown';
}
function esc(s){return String(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}
function exportCSV(){
  const cols=['id','category','location','contents','description','exos_sku','source_sku','qty','unit','value','jurisdiction','is_rocket'];
  const rows=[cols.join(',')].concat(VIEW.map(i=>cols.map(c=>'"'+String(i[c]??'').replace(/"/g,'""')+'"').join(',')));
  const b=new Blob([rows.join('\n')],{type:'text/csv'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='shop-inventory.csv';a.click();
}
document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortDir=(sortK===k)?-sortDir:1;sortK=k;sortAndRender()});
['cat','rocket'].forEach(id=>$(id).onchange=load);
let t;['loc','q'].forEach(id=>$(id).oninput=()=>{clearTimeout(t);t=setTimeout(load,300)});
// ── Inline shop-item edit with a mandatory confirm step + who/when attribution ──
let shopRow=null;
function shopEdit(id){
  shopRow=ALL.find(x=>x.id===id)||VIEW.find(x=>x.id===id); if(!shopRow)return;
  $('se_key').textContent=(shopRow.id||'')+' · '+(shopRow.category||'');
  $('se_contents').value=shopRow.contents||'';
  $('se_description').value=shopRow.description||'';
  $('se_qty').value=(shopRow.qty==null?'':shopRow.qty);
  $('se_location').value=shopRow.location||'';
  $('se_serial').value=shopRow.serial||'';
  $('se_note').value='';
  $('se_diff').innerHTML='';
  $('se_review').style.display='';
  $('se_confirm').style.display='none';
  $('se_ovl').classList.add('on');
}
function shopEditClose(){$('se_ovl').classList.remove('on');shopRow=null;}
function _sef(){if(!shopRow)return{};const f={};
  const c=$('se_contents').value,d=$('se_description').value,q=$('se_qty').value,l=$('se_location').value,n=$('se_note').value.trim();
  if(c!==(shopRow.contents||''))f.contents=c;
  if(d!==(shopRow.description||''))f.description=d;
  if(String(q)!==String(shopRow.qty==null?'':shopRow.qty))f.qty=q;
  if(l!==(shopRow.location||''))f.location=l;
  const sn=$('se_serial').value.trim();if(sn!==(shopRow.serial||''))f.serial=sn;
  if(n)f.note=n;return f;}
function shopEditReview(){
  const f=_sef();const keys=Object.keys(f).filter(k=>k!=='note');
  if(!keys.length&&!f.note){$('se_diff').innerHTML='<div class="diffbox">No changes to confirm.</div>';return;}
  const label={contents:'Contents',description:'Description',qty:'Qty',location:'Location',serial:'Serial #'};
  let html='<div class="diffbox"><strong>Confirm these changes:</strong>';
  keys.forEach(k=>{const oldv=shopRow[k]==null?'':shopRow[k];
    html+='<div class="d">'+label[k]+': <span class="o">'+esc(oldv)+'</span> → <span class="n2">'+esc(f[k])+'</span></div>';});
  if(f.note)html+='<div class="d muted">Note: '+esc(f.note)+'</div>';
  html+='</div>';$('se_diff').innerHTML=html;
  $('se_review').style.display='none';$('se_confirm').style.display='';
}
function shopToast(msg,ok=true){const t=$('se_toast');t.textContent=msg;t.style.borderColor=ok?'#4caf50':'#e0524d';t.style.background=ok?'#12331a':'#331214';t.style.color=ok?'#d7ffd7':'#ffd7d7';t.classList.add('on');clearTimeout(shopToast._t);shopToast._t=setTimeout(()=>t.classList.remove('on'),ok?3000:6000);}
// Optimistic save: apply locally + close the modal IMMEDIATELY so the user is never locked out
// while the request is in flight (the single-threaded MC server can stall for ~a minute when a
// concurrent execFileSync — e.g. a doc/PDF preview render — blocks the event loop). The POST runs
// in the background; on failure we revert the row and flag it, no data is silently lost.
function shopEditConfirm(){
  const row=shopRow;const f=_sef();
  if(!row||!Object.keys(f).length){shopEditClose();return;}
  const before={contents:row.contents,description:row.description,qty:row.qty,location:row.location,serial:row.serial,edit_note:row.edit_note,edited_by:row.edited_by,edited_at:row.edited_at};
  // optimistic local apply
  if(f.contents!==undefined)row.contents=f.contents;
  if(f.description!==undefined)row.description=f.description;
  if(f.qty!==undefined)row.qty=Number(f.qty);
  if(f.location!==undefined)row.location=f.location;
  if(f.serial!==undefined)row.serial=f.serial;
  if(f.note!==undefined)row.edit_note=f.note;
  shopEditClose();sortAndRender();
  shopToast('Saving…');
  fetch('/api/shop/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:row.id,fields:f})})
    .then(async r=>{
      if(r.status===401){location='/login';return;}
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
      row.edited_by=j.edited_by;row.edited_at=j.edited_at;sortAndRender();
      shopToast('Saved · by '+j.edited_by);
    })
    .catch(e=>{
      Object.assign(row,before);sortAndRender();
      shopToast('⚠ Save failed — reverted: '+e.message,false);
    });
}
// ── Photos: several per line + delete behind an explicit confirm (same manager as inventory.html) ──
// Keyed "shop#SHOP-xxxxx" — the SHOP id is permanent, so photos stay on the right part across reloads.
let phRow=null,phAsk=null;
function photoCell(i){
  const ps=i.photos||[],n=ps.length;
  return ps.slice(-2).map(p=>'<img class="thumb" onclick="photoOpen(\''+i.id+'\')" src="'+p.url+'" title="'+esc((p.by||'')+' '+(p.at||'').slice(0,10))+'">').join('')+
    '<button class="phbtn" title="View / add / delete photos" onclick="photoOpen(\''+i.id+'\')">'+(n>2?'+'+(n-2)+' ':'')+'📷'+(n?'':' Add')+'</button>';
}
function photoOpen(id){
  phRow=ALL.find(x=>x.id===id)||VIEW.find(x=>x.id===id); if(!phRow)return;
  phAsk=null;
  $('photoKey').textContent=phRow.id+' · '+(phRow.category||'')+' · '+(phRow.location||'—')+' — '+(phRow.contents||phRow.description||'');
  $('phStatus').textContent='';
  photoRender();
  $('photoOvl').classList.add('on');
}
function photoClose(){$('photoOvl').classList.remove('on');phRow=null;phAsk=null;}
function photoRender(){
  if(!phRow)return;
  const ps=phRow.photos||[];
  $('phGrid').innerHTML=ps.length?ps.map(p=>{
    const conf=phAsk===p.id?'<div class="phconfirm"><strong>Delete this photo?</strong><br>It moves to the recycle bin (restorable for 90 days).'+
      '<br><button onclick="photoAsk(null)">Cancel</button><button class="yes" onclick="photoDelete(\''+esc(p.id)+'\')">Yes, delete</button></div>'
      :'<div class="pacts"><button class="phdel" onclick="photoAsk(\''+esc(p.id)+'\')">🗑 Delete</button></div>';
    return '<div class="phcard"><a href="'+p.url+'" target="_blank"><img src="'+p.url+'"></a><div class="meta">'+esc(p.by||'')+' · '+esc((p.at||'').slice(0,10))+
      (p.caption?'<br>'+esc(p.caption):'')+'</div>'+conf+'</div>';
  }).join(''):'<div class="muted" style="grid-column:1/-1">No photos yet. Add as many as you like.</div>';
}
function photoAsk(id){phAsk=id;photoRender();}
async function photoUpload(inp){
  const row=phRow,files=[...(inp.files||[])]; inp.value=''; if(!row||!files.length)return;
  const st=$('phStatus'); let ok=0,err='';
  for(let k=0;k<files.length;k++){
    st.textContent='Uploading '+(k+1)+' of '+files.length+'…';
    const fd=new FormData(); fd.append('key','shop#'+row.id); fd.append('file',files[k]);
    try{const r=await fetch('/api/inventory/photos/add',{method:'POST',body:fd});
      if(r.status===401){location='/login';return;}
      const j=await r.json(); if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
      row.photos=j.photos; ok++;}catch(e){err=e.message;}
  }
  st.textContent=ok+' of '+files.length+' added'+(err?' · error: '+err:'');
  if(phRow===row)photoRender(); sortAndRender();
  shopToast(err?('Photo upload problem: '+err):(ok+' photo'+(ok>1?'s':'')+' added'),!err);
}
async function photoDelete(id){
  const row=phRow; if(!row)return;
  try{const r=await fetch('/api/inventory/photos/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:'shop#'+row.id,id,confirm:true})});
    if(r.status===401){location='/login';return;}
    const j=await r.json(); if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
    row.photos=j.photos; phAsk=null; if(phRow===row)photoRender(); sortAndRender(); shopToast('Photo deleted (in recycle bin)');
  }catch(e){shopToast('Delete failed: '+e.message,false);}
}
load();
</script>
<div class="ovl" id="se_ovl">
  <div class="modal">
    <h3>✎ Edit shop item</h3>
    <div class="k" id="se_key"></div>
    <label>Contents</label><input id="se_contents" type="text">
    <label>Description</label><textarea id="se_description"></textarea>
    <div class="row2">
      <div><label>Qty</label><input id="se_qty" type="number" step="any"></div>
      <div><label>Location</label><input id="se_location" type="text"></div>
    </div>
    <label>Serial # (one or more, comma-separated)</label><input id="se_serial" type="text" placeholder="e.g. SN-00412, SN-00413">
    <label>Note (optional — reason for the change)</label><input id="se_note" type="text" placeholder="e.g. moved to Trailer 2">
    <div id="se_diff"></div>
    <div class="acts">
      <button class="btn ghost" onclick="shopEditClose()">Cancel</button>
      <button class="btn" id="se_review" onclick="shopEditReview()">Review change →</button>
      <button class="btn" id="se_confirm" style="display:none;background:#2e7d32;color:#fff" onclick="shopEditConfirm()">✓ Confirm &amp; save</button>
    </div>
  </div>
</div>
<div class="ovl" id="photoOvl" onclick="if(event.target===this)photoClose()">
  <div class="modal" style="max-width:760px">
    <h3>📷 Photos</h3>
    <div class="k" id="photoKey"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <label class="btn" style="cursor:pointer;margin:0;display:inline-block;text-transform:none;letter-spacing:0;font-size:.8rem;color:#111">➕ Add photos<input type="file" id="phPick" accept="image/*" multiple style="display:none" onchange="photoUpload(this)"></label>
      <label class="btn ghost" style="cursor:pointer;margin:0;display:inline-block;text-transform:none;letter-spacing:0;font-size:.8rem">📸 Take photo<input type="file" id="phCam" accept="image/*" capture="environment" style="display:none" onchange="photoUpload(this)"></label>
      <span class="muted" id="phStatus" style="font-size:.75rem"></span>
    </div>
    <div class="phgrid" id="phGrid"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="photoClose()">Close</button></div>
  </div>
</div>
<div class="toast" id="se_toast"></div>
</body></html>
