<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BLK3 BOM — Live View</title>
<style>
:root{--bg:#0b0f14;--panel:#121924;--panel2:#0f1622;--line:#1e2a3a;--txt:#e6edf5;--mut:#8aa0b8;--acc:#4ea1ff;--acc2:#1b3a5c;--warn:#ffb454;--warnbg:#3a2c12;--good:#3fb950;}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:5}
h1{margin:0;font-size:18px;font-weight:650;letter-spacing:.2px}
.sub{color:var(--mut);font-size:12px;margin-top:3px}
.kpis{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-width:120px}
.kpi .n{font-size:19px;font-weight:700}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.kpi.warn .n{color:var(--warn)}
.bar{display:flex;gap:8px;align-items:center;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:4}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:7px 13px;border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
.tab .c{opacity:.6;font-size:11px;margin-left:5px}
.tab.active{background:var(--acc2);color:#fff;border-color:var(--acc)}
.tab.hasmiss::after{content:"●";color:var(--warn);margin-left:6px;font-size:10px}
.search{margin-left:auto;display:flex;gap:8px;align-items:center}
input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 11px;width:240px;font-size:13px}
label.ck{color:var(--mut);font-size:12px;display:flex;gap:5px;align-items:center;cursor:pointer;user-select:none}
.wrap{padding:0 20px 40px}
.meta{color:var(--mut);font-size:12px;margin:12px 2px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--panel);border-bottom:2px solid var(--line);text-align:left;padding:8px 10px;cursor:pointer;white-space:nowrap;user-select:none;z-index:2}
thead th:hover{color:var(--acc)}
thead th .ar{opacity:.4;font-size:10px;margin-left:3px}
tbody td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:#0e1826}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.miss{background:var(--warnbg)}
tr.miss:hover{background:#43340f}
.pill{background:var(--warn);color:#221800;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px}
tfoot td{padding:9px 10px;border-top:2px solid var(--line);font-weight:700;background:var(--panel)}
.empty{color:var(--mut);padding:30px;text-align:center}
a.dl{color:var(--acc);font-size:12px;text-decoration:none}
.ebtn{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:.85rem}
.ebtn:hover{border-color:var(--acc);color:var(--acc)}
.etag{color:var(--warn);cursor:help}
.ecell{white-space:nowrap}
.ovl{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}
.ovl.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;width:92%;max-width:520px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:1rem}
.modal .k{color:var(--mut);font-size:.75rem;margin-bottom:10px;font-family:ui-monospace,Menlo,monospace}
.modal label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:10px 0 4px}
.modal input,.modal textarea{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.modal textarea{min-height:58px;resize:vertical}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal .btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:.85rem}
.modal .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.diffbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:12px;font-size:.82rem}
.diffbox .d{margin:4px 0}.diffbox .o{color:#e0524d;text-decoration:line-through}.diffbox .n2{color:var(--good);font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#12331a;border:1px solid var(--good);color:#d7ffd7;padding:10px 16px;border-radius:8px;z-index:60;display:none}
.toast.on{display:block}
</style></head><body>
<header>
  <h1>BLK3 — Bill of Materials <span style="color:var(--mut);font-weight:400">· Live View</span></h1>
  <div class="sub">Source: BLK3 BOM 8-21-2026.xlsx (MC Task #1871) · Extended Cost = Qty × Cost ea (workbook formulas uncached) · <a class="dl" href="/uploads/1787343333564_BLK3_BOM_8-21-2026.xlsx">Download .xlsx</a></div>
  <div class="kpis">
    <div class="kpi"><div class="n" id="kItems">—</div><div class="l">Line items</div></div>
    <div class="kpi"><div class="n" id="kCost">—</div><div class="l">Rolled cost</div></div>
    <div class="kpi warn"><div class="n" id="kMiss">—</div><div class="l">Missing cost</div></div>
    <div class="kpi"><div class="n" id="kSubs">—</div><div class="l">Subassemblies</div></div>
  </div>
</header>
<div class="bar">
  <div class="tabs" id="tabs"></div>
  <div class="search">
    <label class="ck"><input type="checkbox" id="missOnly"/> missing cost only</label>
    <input type="text" id="q" placeholder="Search all BLK3 sections…"/>
  </div>
</div>
<div class="wrap">
  <div class="meta" id="meta"></div>
  <table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody><tfoot id="tfoot"></tfoot></table>
  <div class="empty" id="empty" style="display:none">No matching rows.</div>
</div>
<script>
let DATA=null;
let COLS=[];
const money=n=>n==null?'':'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
// Cost-basis chip: Paid=green (actual $), Found=orange (researched), BOM=grey (on Steve's BOM).
function basisPill(b){
  const M={paid:['Paid','#16351f','#6ee7a0'],found:['Found','#3a2a12','#f5a742'],'bom-sheet':['BOM','#2a2a2a','#b7b7b7'],none:['—','transparent','#666']};
  const x=M[b]||M.none;
  return '<span style="display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;background:'+x[1]+';color:'+x[2]+'">'+x[0]+'</span>';
}
let cur=0, sortCol=null, sortDir=1;
function numeric(c){return c==='Quantity'||c==='Cost ea'||c==='Extended Cost';}
function render(){
  if(!DATA)return;
  const q=document.getElementById('q').value.trim().toLowerCase();
  const missOnly=document.getElementById('missOnly').checked;
  const global=!!q;                       // a query searches ALL BLK3 sections, not just this tab
  const s=global?null:DATA.sheets[cur];
  const activeCols=(global?['Section'].concat(COLS):COLS).concat(['Basis','Source']);
  let rows=[];
  if(global){
    DATA.sheets.forEach(sh=>{sh.rows.forEach(r=>{
      if(missOnly && !(r['Extended Cost']==null)) return;
      if(COLS.some(c=>String(r[c]??'').toLowerCase().includes(q))||String(r._serial||'').toLowerCase().includes(q)) rows.push(Object.assign({Section:sh.name},r));
    });});
  } else {
    rows=s.rows.filter(r=>!(missOnly && !(r['Extended Cost']==null)));
  }
  if(sortCol!=null){const c=sortCol;rows=rows.slice().sort((a,b)=>{let x=a[c],y=b[c];if(numeric(c)){x=x==null||x===''?-Infinity:+x;y=y==null||y===''?-Infinity:+y;return (x-y)*sortDir;}return String(x??'').localeCompare(String(y??''))*sortDir;});}
  const thead=document.getElementById('thead');
  thead.innerHTML='<tr>'+activeCols.map(c=>{const ar=sortCol===c?(sortDir>0?'▲':'▼'):'';return '<th data-c="'+c+'" class="'+(numeric(c)?'num':'')+'">'+c+'<span class="ar">'+ar+'</span></th>';}).join('')+'<th>Edit</th></tr>';
  thead.querySelectorAll('th').forEach(th=>th.onclick=()=>{const c=th.dataset.c;if(sortCol===c)sortDir*=-1;else{sortCol=c;sortDir=1;}render();});
  const tb=document.getElementById('tbody');
  tb.innerHTML=rows.map(r=>{
    const miss=r['Extended Cost']==null;
    return '<tr class="'+(miss?'miss':'')+'">'+activeCols.map(c=>{
      let v=r[c];
      if(c==='Extended Cost') return '<td class="num">'+(v==null?'<span class="pill">no cost</span>':money(v))+'</td>';
      if(c==='Cost ea') return '<td class="num">'+(v===''||v==null?'':money(v))+'</td>';
      if(c==='Quantity') return '<td class="num">'+(v===''||v==null?'':v)+'</td>';
      if(c==='Basis') return '<td>'+basisPill(r._basis)+'</td>';
      if(c==='Source') return '<td class="src" title="'+String(r._costsrc||'').replace(/"/g,'&quot;')+'">'+String(r._costsrc||'').replace(/[<>&]/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]))+'</td>';
      const cell=String(v??'').replace(/[<>&]/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]));
      if(c==='Description'&&r._serial) return '<td>'+cell+'<div style="font-size:11px;color:var(--mut,#8aa0bd);margin-top:2px">S/N: '+String(r._serial).replace(/[<>&]/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]))+'</div></td>';
      return '<td>'+cell+'</td>';
    }).join('')+
      '<td class="ecell">'+(r._eby?'<span class="etag" title="edited by '+String(r._eby).replace(/"/g,'')+' on '+String(r._eat||'').slice(0,10)+(r._enote?(' · '+String(r._enote).replace(/"/g,'')):'')+'">✎</span> ':'')+
      '<button class="ebtn" title="Edit line" onclick="bomEdit(\''+encodeURIComponent(r._key||'')+'\')">✎</button></td></tr>';
  }).join('');
  document.getElementById('empty').style.display=rows.length?'none':'block';
  const shown=rows.length, tot=rows.reduce((a,r)=>a+(r['Extended Cost']||0),0);
  document.getElementById('meta').textContent=global?('BLK3-wide search — '+shown+' match'+(shown===1?'':'es')+' for “'+q+'” across all '+DATA.sheets.length+' sections'):(s.name+' — '+shown+' of '+s.count+' line items'+(s.missing?' · '+s.missing+' missing cost':''));
  const tf=document.getElementById('tfoot');
  tf.innerHTML='<tr><td colspan="'+(activeCols.length-3)+'">'+(global?'Matches':'Subassembly')+' total ('+shown+' shown)</td><td class="num">'+money(tot)+'</td><td></td><td></td><td></td></tr>';
}
document.getElementById('q').oninput=render;
document.getElementById('missOnly').onchange=render;
function _recost(row){const ce=parseFloat(row['Cost ea']);if(!isNaN(ce)&&row.Quantity!==''&&row.Quantity!=null&&!isNaN(parseFloat(row.Quantity)))row['Extended Cost']=Math.round(parseFloat(row.Quantity)*ce*100)/100;}
// ── Inline edit with a mandatory confirm step + who/when attribution ──
let editRow=null;
function _findRow(k){for(const sh of DATA.sheets)for(const r of sh.rows)if(r._key===k)return r;return null;}
function bomEdit(k){
  k=decodeURIComponent(k); editRow=_findRow(k); if(!editRow)return;
  document.getElementById('be_key').textContent=k;
  document.getElementById('be_description').value=editRow.Description||'';
  document.getElementById('be_vpn').value=editRow['Vendor P/N']||'';
  document.getElementById('be_mpn').value=editRow['Manufacturer P/N']||'';
  document.getElementById('be_req').value=(editRow.Quantity==null?'':editRow.Quantity);
  document.getElementById('be_location').value=editRow._loc||'';
  document.getElementById('be_serial').value=editRow._serial||'';
  document.getElementById('be_note').value='';
  document.getElementById('be_diff').innerHTML='';
  document.getElementById('be_review').style.display='';
  document.getElementById('be_confirm').style.display='none';
  document.getElementById('be_ovl').classList.add('on');
}
function bomEditClose(){document.getElementById('be_ovl').classList.remove('on');editRow=null;}
function _bef(){if(!editRow)return{};const f={};
  const d=document.getElementById('be_description').value;
  const vp=document.getElementById('be_vpn').value.trim();
  const mp=document.getElementById('be_mpn').value.trim();
  const rq=document.getElementById('be_req').value;
  const lc=document.getElementById('be_location').value;
  const sn=document.getElementById('be_serial').value.trim();
  const nt=document.getElementById('be_note').value.trim();
  if(d!==(editRow.Description||''))f.description=d;
  if(vp!==(editRow['Vendor P/N']||''))f.vendor_pn=vp;
  if(mp!==(editRow['Manufacturer P/N']||''))f.mfg_pn=mp;
  if(String(rq)!==String(editRow.Quantity==null?'':editRow.Quantity))f.req=rq;
  if(lc!==(editRow._loc||''))f.location=lc;
  if(sn!==(editRow._serial||''))f.serial=sn;
  if(nt)f.note=nt; return f;}
function _esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function bomEditReview(){
  const f=_bef();const keys=Object.keys(f).filter(k=>k!=='note');
  if(!keys.length&&!f.note){document.getElementById('be_diff').innerHTML='<div class="diffbox">No changes to confirm.</div>';return;}
  const label={description:'Description',vendor_pn:'Vendor P/N',mfg_pn:'Manufacturer P/N',req:'Quantity',location:'Location',serial:'Serial #'};
  const cur=k=>k==='vendor_pn'?(editRow['Vendor P/N']||''):k==='mfg_pn'?(editRow['Manufacturer P/N']||''):k==='description'?(editRow.Description||''):k==='location'?(editRow._loc||''):k==='serial'?(editRow._serial||''):(editRow.Quantity==null?'':editRow.Quantity);
  let html='<div class="diffbox"><strong>Confirm these changes:</strong>';
  keys.forEach(k=>{const oldv=cur(k);
    html+='<div class="d">'+label[k]+': <span class="o">'+_esc(oldv)+'</span> → <span class="n2">'+_esc(f[k])+'</span></div>';});
  if(f.note)html+='<div class="d" style="color:var(--mut)">Note: '+_esc(f.note)+'</div>';
  html+='</div>';document.getElementById('be_diff').innerHTML=html;
  document.getElementById('be_review').style.display='none';
  document.getElementById('be_confirm').style.display='';
}
async function bomEditConfirm(){
  const f=_bef();if(!Object.keys(f).length){bomEditClose();return;}
  const btn=document.getElementById('be_confirm');btn.disabled=true;btn.textContent='Saving…';
  try{
    const r=await fetch('/api/bom/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:editRow._key,fields:f})});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){location='/login';return;}
    if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
    if(f.description!==undefined)editRow.Description=f.description;
    if(f.vendor_pn!==undefined)editRow['Vendor P/N']=f.vendor_pn;
    if(f.mfg_pn!==undefined)editRow['Manufacturer P/N']=f.mfg_pn;
    if(f.req!==undefined){editRow.Quantity=f.req;_recost(editRow);}
    if(f.location!==undefined)editRow._loc=f.location;
    if(f.serial!==undefined)editRow._serial=f.serial;
    if(f.note!==undefined)editRow._enote=f.note;
    editRow._eby=j.edited_by;editRow._eat=j.edited_at;
    bomEditClose();render();
    const t=document.getElementById('be_toast');t.textContent='Saved · by '+j.edited_by;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000);
  }catch(e){btn.disabled=false;btn.textContent='✓ Confirm & save';alert('Save failed: '+e.message);}
}
async function init(){
  const resp=await fetch('/api/bom');
  if(resp.status===401){location='/login';return;}
  try{DATA=await resp.json();}catch(e){console.error('Failed to load BOM',e);return;}
  COLS=DATA.cols;
  document.getElementById('kItems').textContent=DATA.gcount.toLocaleString();
  document.getElementById('kCost').textContent=money(DATA.grand);
  document.getElementById('kMiss').textContent=DATA.gmiss;
  document.getElementById('kSubs').textContent=DATA.sheets.length;
  const tabs=document.getElementById('tabs');
  DATA.sheets.forEach((s,i)=>{const b=document.createElement('div');b.className='tab'+(i==0?' active':'')+(s.missing?' hasmiss':'');b.innerHTML=s.name+' <span class="c">'+s.count+'</span>';b.onclick=()=>{cur=i;sortCol=null;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');render();};tabs.appendChild(b);});
  render();
}
init();
</script>
<div class="ovl" id="be_ovl">
  <div class="modal">
    <h3>✎ Edit BOM line</h3>
    <div class="k" id="be_key"></div>
    <label>Vendor P/N</label><input id="be_vpn" type="text">
    <label>Manufacturer P/N</label><input id="be_mpn" type="text">
    <label>Description</label><textarea id="be_description"></textarea>
    <label>Quantity</label><input id="be_req" type="number" step="any">
    <label>Location</label><input id="be_location" type="text" placeholder="e.g. Parts Room B3, Shelf 2">
    <label>Serial # (one or more, comma-separated)</label><input id="be_serial" type="text" placeholder="e.g. SN-00412, SN-00413">
    <label>Note (optional — reason for the change)</label><input id="be_note" type="text" placeholder="e.g. corrected qty per drawing rev">
    <div id="be_diff"></div>
    <div class="acts">
      <button class="btn ghost" onclick="bomEditClose()">Cancel</button>
      <button class="btn" id="be_review" onclick="bomEditReview()">Review change →</button>
      <button class="btn" id="be_confirm" style="display:none;background:#2e7d32" onclick="bomEditConfirm()">✓ Confirm &amp; save</button>
    </div>
  </div>
</div>
<div class="toast" id="be_toast"></div>
</body></html>
